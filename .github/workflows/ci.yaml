name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The knowledge-base repo is private, so it cannot be cloned inside the
      # image build. Clone it here with the ephemeral GITHUB_TOKEN (minimum
      # permission: contents read) and drop .git so no credentials land in the
      # build context. skills.sh then installs its skills from this folder.
      - name: Clone private knowledge-base repo
        env:
          KB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${KB_TOKEN}@github.com/mmontes11/knowledge-base.git" knowledge-base
          rm -rf knowledge-base/.git

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          platforms: linux/amd64
